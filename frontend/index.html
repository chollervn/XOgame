<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cờ XO AI - 5 quân liên tiếp</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <!-- Đã tách toàn bộ CSS inline ra file /static/styles.css -->
  </head>
  <body>
    <main class="app-shell">
      <section class="panel">
        <h1>Cờ XO AI</h1>
        <p class="subtitle">5 ô liên tiếp</p>

        <div class="controls">
          <label for="sizeSelect">Kích thước bàn</label>
          <select id="sizeSelect">
            <option value="7">7 x 7</option>
            <option value="9" selected>9 x 9</option>
            <option value="11">11 x 11</option>
          </select>

          <label for="difficultySelect">Độ khó</label>
          <select id="difficultySelect">
            <option value="easy">Dễ</option>
            <option value="medium" selected>Trung bình</option>
            <option value="hard">Khó</option>
          </select>

          <button id="newGameBtn" type="button">Ván mới</button>
        </div>

        <div class="status" id="statusBox">
          <p id="roleInfo">Bạn: X | AI: O</p>
          <p id="turnInfo">Nhấn "Ván mới" để bắt đầu.</p>
          <p id="resultInfo"></p>
        </div>
      </section>

      <section class="board-panel">
        <div id="board" class="board" aria-label="Bàn cờ XO"></div>
      </section>
    </main>

    <script src="/static/app.js" defer></script>
  </body>
</html>
